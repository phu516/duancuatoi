<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Đổi mật khẩu')}"></head><body>
<header th:replace="~{fragments :: header}"></header><main id="main" class="container page">
<div th:replace="~{fragments :: alerts}"></div><h1>Đổi mật khẩu</h1>
<div class="panel"><form th:action="@{/account/password}" th:object="${form}" method="post">
<label>Mật khẩu hiện tại<input th:field="*{oldPassword}" type="password" autocomplete="current-password" required></label><small th:errors="*{oldPassword}"></small>
<label>Mật khẩu mới<input th:field="*{newPassword}" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label><small th:errors="*{newPassword}"></small>
<label>Nhập lại mật khẩu mới<input th:field="*{passwordConfirmation}" type="password" autocomplete="new-password" required></label><small th:errors="*{passwordConfirmation}"></small>
<button class="button" type="submit">Đổi mật khẩu</button></form></div>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
