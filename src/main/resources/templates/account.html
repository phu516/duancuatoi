<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Hồ sơ của tôi')}"></head><body>
<header th:replace="~{fragments :: header}"></header><main id="main" class="container page">
<div th:replace="~{fragments :: alerts}"></div><h1>Hồ sơ của tôi</h1>
<div class="panel"><p>Email: <strong th:text="${account.email}"></strong></p>
<form th:action="@{/account}" th:object="${form}" method="post">
<label>Họ tên<input th:field="*{fullName}" maxlength="100" required></label><small th:errors="*{fullName}"></small>
<label>Số điện thoại<input th:field="*{phone}" maxlength="30"></label><small th:errors="*{phone}"></small>
<label>Địa chỉ<input th:field="*{address}" maxlength="255"></label><small th:errors="*{address}"></small>
<button class="button" type="submit">Lưu hồ sơ</button></form></div>
<p><a class="button secondary" th:href="@{/account/password}">Đổi mật khẩu</a></p>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
