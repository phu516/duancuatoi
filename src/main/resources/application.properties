spring.application.name=pet-shop
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
#spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pet_shop_api?createDatabaseIfNotExist=true&connectionTimeZone=UTC}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
server.error.include-message=never
server.error.include-stacktrace=never
app.shipping.pet-taxi-fee=${PET_TAXI_FEE:100000}
app.orders.expiry-enabled=${ORDER_EXPIRY_ENABLED:true}
app.orders.expiry-delay-ms=${ORDER_EXPIRY_DELAY_MS:60000}
app.rate-limit.login-ip=${RATE_LOGIN_IP:20}
app.rate-limit.login-email=${RATE_LOGIN_EMAIL:8}
app.rate-limit.registration=${RATE_REGISTRATION:5}
app.rate-limit.orders=${RATE_ORDERS:10}
app.rate-limit.login-window-seconds=${RATE_LOGIN_WINDOW_SECONDS:900}
app.rate-limit.registration-window-seconds=${RATE_REGISTRATION_WINDOW_SECONDS:3600}
app.rate-limit.order-window-seconds=${RATE_ORDER_WINDOW_SECONDS:60}
